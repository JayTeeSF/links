<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Zombie Shake & Throw</title>
</head>

<body>
    <h1>Zombie Shake & Throw</h1>
    <p id="instructions" style="visibility:hidden"></p>
    Num Players: <input id="numPlayers" type="number" min="1" max="4" value="1">
    <button id="nextTurnButton" style="visibility:hidden" onclick="nextTurn()">Pass</button>
    <button id="grabDiceButton" style="display:none" onclick="grabDice()">Grab Dice</button>
    <button id="rollButton" style="display:none" onclick="roll()">Roll</button>
    <br />
    <button id="quitButton" style="visibility:hidden" onclick="endGame()">Quit</button>
    <br />
    <button id="gameStartButton" onclick="setupGame()">Start Game</button>
    <p id="playerList"></p>
    <p id="currentStats"></p>
    <br />
    <br />
    <div id="playArea"></div>
    <script src="/zombie_shake_and_throw/script.js"></script>
</body>

</html>
