    canvas { display: block; }
    .tooltip {

      padding: 8px;
      border-radius: 4px;
      pointer-events: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: 180px;
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      cellWidth = (width - tableOffsetX * 2) / cols;
      cellHeight = (height - tableOffsetY * 2) / rows;
      setupElements();
      tooltip = select('#tooltip');
      textAlign(CENTER, CENTER);
      rectMode(CORNER);
    }
    
    function draw() {
      background(20);
      drawTable();
      handleHover();
    }
    
    // Draw the grid and each element cell.
    function drawTable() {
      stroke(100);
      noFill();
      // Vertical grid lines.
      for (let i = 0; i <= cols; i++) {
        line(tableOffsetX + i * cellWidth, tableOffsetY, tableOffsetX + i * cellWidth, tableOffsetY + rows * cellHeight);
      }
      // Horizontal grid lines.
      for (let j = 0; j <= rows; j++) {
        line(tableOffsetX, tableOffsetY + j * cellHeight, tableOffsetX + cols * cellWidth, tableOffsetY + j * cellHeight);
      }
      // Draw element cells.
      for (let el of elements) {
        let x = tableOffsetX + el.col * cellWidth;
        let y = tableOffsetY + el.row * cellHeight;
        fill(50);
        rect(x, y, cellWidth, cellHeight);
        fill(255);
        textSize(16);
        text(el.symbol, x + cellWidth / 2, y + cellHeight / 2 - 10);
        textSize(10);
        text(el.atomicNumber, x + 20, y + 15);
      }
    }
    
    // Check mouse hover over a cell and position tooltip accordingly.
    function handleHover() {
      let hoveredElement = null;
      for (let el of elements) {
        let x = tableOffsetX + el.col * cellWidth;
        let y = tableOffsetY + el.row * cellHeight;
        if (mouseX > x && mouseX < x + cellWidth && mouseY > y && mouseY < y + cellHeight) {
          hoveredElement = el;
          break;
        }
      }
      if (hoveredElement) {
        tooltip.style('display', 'block');
        tooltip.html(
          "<strong>" + hoveredElement.name + "</strong><br>" +
          "Symbol: " + hoveredElement.symbol + "<br>" +
          "Atomic Number: " + hoveredElement.atomicNumber + "<br>" +
          "Electron Config: " + hoveredElement.electronConfig
        );
        // Determine horizontal position.
        let xPos = (hoveredElement.col >= cols - 3) ? mouseX - 200 : mouseX + 15;
        // Determine vertical position.
        let yPos = (hoveredElement.row >= rows - 1) ? mouseY - 60 : mouseY + 15;
        tooltip.position(xPos, yPos);
        // Always draw the atomic structure centered on the canvas.
        drawAtomicStructure(hoveredElement, width / 2, height / 2);
      } else {
        tooltip.style('display', 'none');
      }
    }
    
    // Draw an animated atomic structure.
    function drawAtomicStructure(el, posX, posY) {
      push();
      translate(posX, posY);
      noStroke();
      // Draw nucleus.
      fill(200, 50, 50);
      ellipse(0, 0, 30, 30);
      
      let totalElectrons = el.electrons;
      let electronsDrawn = 0;
      let layer = 1;
      // For each orbital layer.
      while (electronsDrawn < totalElectrons) {
        let maxInOrbit = floor(TWO_PI * layer / 30) + 1;
        let electronsInOrbit = min(totalElectrons - electronsDrawn, maxInOrbit);
        let offset = ((el.atomicNumber + layer) * 0.73) % TWO_PI;
        let angleStep = TWO_PI / electronsInOrbit;
        for (let i = 0; i < electronsInOrbit && electronsDrawn < totalElectrons; i++) {
          let rotationSpeed = millis() / (500 * layer);
          let wiggle = sin(millis() / 200 + i) * 0.1;
          let angle = offset + angleStep * i + rotationSpeed + wiggle;
          let ex = layer * 20 * cos(angle);
          let ey = layer * 20 * sin(angle);
          fill(100, 200, 255);
          ellipse(ex, ey, 10, 10);
          electronsDrawn++;
        }
        noFill();
        stroke(150, 150, 150, 100);
        ellipse(0, 0, layer * 40, layer * 40);
        layer++;
      }
      pop();
    }
    
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      cellWidth = (width - tableOffsetX * 2) / cols;
      cellHeight = (height - tableOffsetY * 2) / rows;
    }
  </script>
