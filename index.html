<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Explore Links</h1>
<input type="search" id="search" class="form-control mb-3" placeholder="Search by keyword, tag, or category...">
<div id="links">
  
    <div class="card mb-3 favorite">
      <img src="./images/movie.png" class="card-img-top" alt="Amazing Movie">
      <div class="card-body">
        <h5 class="card-title">
          <a href="https://example.com/movie" target="_blank">Amazing Movie</a>
          
            <span class="badge bg-warning text-dark">★ Favorite</span>
          
        </h5>
        <p class="card-text">An amazing movie to watch.</p>
        <p class="card-text">
          <strong>Rating:</strong> ⭐⭐⭐⭐⭐<br>
          <strong>Category:</strong> Video<br>
          <strong>Date Added:</strong> 2025-01-01<br>
          <strong>Tags:</strong> inspiring, action
        </p>
      </div>
    </div>
  
    <div class="card mb-3 ">
      <img src="./images/podcast.png" class="card-img-top" alt="Cool Podcast">
      <div class="card-body">
        <h5 class="card-title">
          <a href="https://example.com/podcast" target="_blank">Cool Podcast</a>
          
        </h5>
        <p class="card-text">A podcast worth listening to.</p>
        <p class="card-text">
          <strong>Rating:</strong> ⭐⭐⭐⭐<br>
          <strong>Category:</strong> Audio<br>
          <strong>Date Added:</strong> 2024-12-25<br>
          <strong>Tags:</strong> education, technology
        </p>
      </div>
    </div>
  
</div>

  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="./js/scripts.js"></script>
</body>
</html>
